<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Liquid Glass Messenger</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #070b14;
      overflow: hidden;
      color: #ffffff;
    }

    /* পেছনের ভাসমান রঙিন অর্ব */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
      animation: float 9s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #00d2ff, #2563eb);
      top: 5%;
      left: 10%;
    }

    .orb-2 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #ec4899, #7e22ce);
      bottom: 5%;
      right: 10%;
      animation-delay: -4s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(20px, -25px) scale(1.08); }
    }

    /* কমন লিকুইড গ্লাস স্টাইল */
    .glass-panel {
      position: relative;
      z-index: 1;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04));
      backdrop-filter: blur(24px) saturate(165%);
      -webkit-backdrop-filter: blur(24px) saturate(165%);
      border-top: 1.5px solid rgba(255, 255, 255, 0.45);
      border-left: 1.5px solid rgba(255, 255, 255, 0.35);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    /* লগইন / রুম জয়েন কার্ড */
    #login-screen {
      width: 90%;
      max-width: 380px;
      padding: 32px 26px;
      border-radius: 28px;
      text-align: center;
    }

    #login-screen h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    #login-screen p {
      font-size: 13.5px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .glass-input {
      width: 100%;
      padding: 13px 16px;
      margin-bottom: 14px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 14.5px;
      outline: none;
      transition: border 0.3s, background 0.3s;
    }

    .glass-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .glass-input:focus {
      border-color: rgba(255, 255, 255, 0.65);
      background: rgba(255, 255, 255, 0.14);
    }

    .liquid-btn {
      width: 100%;
      padding: 13px;
      border-radius: 15px;
      border: none;
      border-top: 1.5px solid rgba(255, 255, 255, 0.5);
      border-left: 1.5px solid rgba(255, 255, 255, 0.35);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.1));
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    .liquid-btn:active {
      transform: scale(0.97);
    }

    /* মেইন চ্যাট ইন্টারফেস */
    #chat-screen {
      display: none;
      flex-direction: column;
      width: 100%;
      max-width: 440px;
      height: 100dvh;
    }

    @media (min-width: 500px) {
      #chat-screen {
        height: 88dvh;
        border-radius: 28px;
        overflow: hidden;
      }
    }

    /* চ্যাট হেডার */
    .chat-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
    }

    .header-info h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      margin-right: 6px;
    }

    .header-info span {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    .leave-btn {
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
    }

    /* মেসেজ এরিয়া */
    .messages-area {
      flex: 1;
      padding: 18px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .messages-area::-webkit-scrollbar {
      width: 4px;
    }
    .messages-area::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    /* মেসেজ বাবল */
    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 78%;
      animation: popIn 0.25s ease;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg-wrapper.me {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-wrapper.other {
      align-self: flex-start;
      align-items: flex-start;
    }

    .sender-name {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 4px;
      padding: 0 6px;
    }

    .msg-bubble {
      padding: 11px 15px;
      border-radius: 20px;
      font-size: 14.5px;
      line-height: 1.45;
      word-wrap: break-word;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .me .msg-bubble {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.32), rgba(58, 123, 213, 0.22));
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      border-left: 1px solid rgba(255, 255, 255, 0.35);
      border-bottom-right-radius: 6px;
    }

    .other .msg-bubble {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.07));
      border-top: 1px solid rgba(255, 255, 255, 0.4);
      border-left: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom-left-radius: 6px;
    }

    .msg-time {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
      padding: 0 6px;
    }

    /* নিচের মেসেজ ইনপুট বার */
    .chat-input-bar {
      padding: 12px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
    }

    .chat-input-bar input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 14.5px;
      outline: none;
    }

    .chat-input-bar input::placeholder {
      color: rgba(255, 255, 255, 0.55);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      border-top: 1.5px solid rgba(255, 255, 255, 0.55);
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.45), rgba(236, 72, 153, 0.4));
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s;
    }

    .send-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- রুম জয়েন স্ক্রিন -->
  <div id="login-screen" class="glass-panel">
    <h2>Liquid Glass Chat</h2>
    <p>আপনার নাম এবং একটি সিক্রেট রুম কোড দিন। দুজনে একই রুম কোড দিয়ে ঢুকলে লাইভ কথা বলতে পারবেন।</p>
    <input type="text" id="username-input" class="glass-input" placeholder="আপনার নাম লিখুন..." />
    <input type="text" id="room-input" class="glass-input" placeholder="সিক্রেট রুম কোড (যেমন: secret-9988)" />
    <button class="liquid-btn" onclick="joinRoom()">চ্যাটে প্রবেশ করুন</button>
  </div>

  <!-- মেইন চ্যাট স্ক্রিন -->
  <div id="chat-screen" class="glass-panel">
    <div class="chat-header">
      <div class="header-info">
        <h3 id="display-room">Room</h3>
        <span><i class="status-dot"></i>লাইভ কানেক্টেড</span>
      </div>
      <button class="leave-btn" onclick="leaveRoom()">বের হন</button>
    </div>

    <div class="messages-area" id="messages-area"></div>

    <form class="chat-input-bar" onsubmit="sendMessage(event)">
      <input type="text" id="msg-input" placeholder="মেসেজ লিখুন..." autocomplete="off" />
      <button type="submit" class="send-btn">➤</button>
    </form>
  </div>

  <script>
    let currentUser = '';
    let currentRoom = '';
    let eventSource = null;
    const seenIds = new Set();

    // আগে সেভ করা তথ্য থাকলে অটো লোড হবে
    window.onload = () => {
      const savedName = localStorage.getItem('lg_user');
      const savedRoom = localStorage.getItem('lg_room');
      if (savedName) document.getElementById('username-input').value = savedName;
      if (savedRoom) document.getElementById('room-input').value = savedRoom;
    };

    function joinRoom() {
      const name = document.getElementById('username-input').value.trim();
      const rawRoom = document.getElementById('room-input').value.trim().toLowerCase().replace(/[^a-z0-9-_]/g, '');

      if (!name || !rawRoom) {
        alert('দয়া করে নাম এবং সিক্রেট রুম কোড দিন!');
        return;
      }

      currentUser = name;
      currentRoom = 'lg-chat-' + rawRoom;

      localStorage.setItem('lg_user', name);
      localStorage.setItem('lg_room', rawRoom);

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('chat-screen').style.display = 'flex';
      document.getElementById('display-room').innerText = 'রুম: ' + rawRoom;

      connectStream();
    }

    function leaveRoom() {
      if (eventSource) eventSource.close();
      seenIds.clear();
      document.getElementById('messages-area').innerHTML = '';
      document.getElementById('chat-screen').style.display = 'none';
      document.getElementById('login-screen').style.display = 'block';
    }

    // ntfy.sh থেকে রিয়েল-টাইম মেসেজ শোনা (আগের সাম্প্রতিক মেসেজসহ)
    function connectStream() {
      if (eventSource) eventSource.close();
      const url = `https://ntfy.sh/${currentRoom}/sse?since=12h`;
      eventSource = new EventSource(url);

      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.event === 'message' && !seenIds.has(data.id)) {
            seenIds.add(data.id);
            const payload = JSON.parse(data.message);
            renderMessage(payload.sender, payload.text, payload.time);
          }
        } catch (e) {
          // সাধারণ টেক্সট মেসেজ হলে ইগনোর করবে
        }
      };
    }

    // মেসেজ পাঠানো
    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const payload = JSON.stringify({
        sender: currentUser,
        text: text,
        time: timeStr
      });

      try {
        await fetch(`https://ntfy.sh/${currentRoom}`, {
          method: 'POST',
          body: payload
        });
      } catch (err) {
        alert('মেসেজ পাঠানো যায়নি, ইন্টারনেট চেক করুন।');
      }
    }

    // স্ক্রিনে গ্লাস বাবল দেখানো
    function renderMessage(sender, text, time) {
      const area = document.getElementById('messages-area');
      const isMe = sender === currentUser;

      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper ' + (isMe ? 'me' : 'other');

      const nameEl = document.createElement('div');
      nameEl.className = 'sender-name';
      nameEl.innerText = isMe ? 'আপনি' : sender;

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerText = text;

      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      timeEl.innerText = time || '';

      wrapper.appendChild(nameEl);
      wrapper.appendChild(bubble);
      wrapper.appendChild(timeEl);

      area.appendChild(wrapper);
      area.scrollTop = area.scrollHeight;
    }
  </script>
</body>
</html>
